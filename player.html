<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CourtTrack — Southbay Hoops</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{--orange:#FF4500;--dark:#0a0a0a;--dark2:#111;--dark3:#161616;--muted:#888;--white:#fff;--green:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{background:#0d0d0d;border-bottom:2px solid #1a1a1a;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer;}
.nav-logo span{color:var(--orange);}
.nav-logo small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px;font-family:'Barlow',sans-serif;font-weight:600;margin-top:-4px;}
.league-btn{background:var(--dark2);border:1px solid #333;border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;font-family:'Barlow',sans-serif;white-space:nowrap;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d0d;border-top:1px solid #1a1a1a;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;border:none;background:transparent;gap:4px;min-height:52px;}
.bnav-btn.active{color:var(--orange);}
.bnav-btn svg{width:20px;height:20px;fill:currentColor;}

/* PAGES */
.page{display:none;padding:16px 16px 80px;}
.page.active{display:block;}

/* LEAGUE OVERLAY */
.overlay{position:fixed;inset:0;background:var(--dark);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;}
.overlay-title{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--white);letter-spacing:3px;text-align:center;margin-bottom:6px;}
.overlay-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;}
.league-option{width:100%;max-width:440px;background:var(--dark2);border:1px solid #2a2a2a;border-radius:10px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color 0.15s;}
.league-option:hover,.league-option:active{border-color:var(--orange);}
.lo-icon{font-size:28px;}
.lo-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--white);}
.lo-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* CARDS */
.card{background:var(--dark2);border:1px solid #1e1e1e;border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--white);letter-spacing:2px;margin-bottom:16px;}

/* LIVE TICKER */
.ticker-wrap{background:var(--orange);overflow:hidden;height:32px;display:flex;align-items:center;}
.ticker-inner{white-space:nowrap;animation:scroll 20s linear infinite;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;padding:0 40px;}
@keyframes scroll{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}

/* LIVE SCORE */
.live-card{background:linear-gradient(135deg,#1a1a1a,#0d0d0d);border:1px solid #FF450044;border-radius:12px;padding:20px;margin-bottom:12px;}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#22c55e22;border:1px solid #22c55e44;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#22c55e;letter-spacing:2px;margin-bottom:12px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.live-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.live-team{text-align:center;flex:1;}
.live-tname{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;}
.live-score{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;color:var(--orange);}
.live-vsep{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#333;}
.live-meta{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:1px;}

/* SCHEDULE */
.game-day{margin-bottom:20px;}
.game-day-header{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--orange);letter-spacing:2px;text-transform:uppercase;padding:8px 0;border-bottom:1px solid #1e1e1e;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.bye-label{background:#eab30822;color:#eab308;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:1px;}
.game-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #111;}
.game-row:last-child{border-bottom:none;}
.game-time{font-size:12px;color:var(--muted);min-width:56px;font-weight:600;}
.game-teams{flex:1;font-size:14px;font-weight:600;}
.game-vs{color:var(--muted);font-size:12px;margin:0 4px;}
.game-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:1px;}
.status-upcoming{background:#1a1a1a;color:var(--muted);}
.status-final{background:#22c55e22;color:#22c55e;}
.status-live{background:#FF450022;color:var(--orange);}
.playoff-day .game-day-header{color:var(--orange);border-color:var(--orange);}

/* STANDINGS */
.standings-table{width:100%;border-collapse:collapse;}
.standings-table th{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:8px 6px;text-align:center;border-bottom:1px solid #1e1e1e;}
.standings-table th:first-child{text-align:left;}
.standings-table td{padding:10px 6px;text-align:center;font-size:14px;border-bottom:1px solid #111;}
.standings-table td:first-child{text-align:left;font-weight:700;}
.standings-table tr:last-child td{border-bottom:none;}
.rank-num{color:var(--muted);font-size:12px;margin-right:8px;}
.playoff-line td{border-top:2px dashed var(--orange)!important;}

/* BRACKET */
.bracket-wrap{overflow-x:auto;padding-bottom:12px;}
.bracket{display:flex;gap:0;align-items:center;min-width:480px;}
.b-round{display:flex;flex-direction:column;gap:20px;}
.b-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:10px;}
.b-match{background:var(--dark3);border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;width:160px;}
.b-team{padding:9px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.b-team:first-child{border-bottom:1px solid #1e1e1e;}
.b-seed{font-size:10px;font-weight:700;color:var(--orange);min-width:18px;}
.b-date{font-size:10px;color:var(--muted);text-align:center;padding:4px;background:#0d0d0d;}
.b-connector{width:32px;position:relative;height:120px;flex-shrink:0;}
.b-champ{background:linear-gradient(135deg,#FF450022,#FF450044);border:2px solid var(--orange);border-radius:12px;padding:20px 16px;text-align:center;width:160px;}
.b-champ-icon{font-size:32px;margin-bottom:6px;}
.b-champ-label{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--orange);letter-spacing:2px;}
.b-champ-date{font-size:11px;color:var(--muted);margin-top:4px;}

/* TEAMS */
.team-card{background:var(--dark2);border:1px solid #1e1e1e;border-radius:10px;padding:14px;margin-bottom:10px;}
.team-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.team-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.team-name-h{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;}
.player-list{display:flex;flex-wrap:wrap;gap:6px;}
.player-tag{background:var(--dark3);border:1px solid #222;border-radius:5px;padding:4px 10px;font-size:12px;color:#ccc;}

/* STATS */
.stats-table{width:100%;border-collapse:collapse;font-size:13px;}
.stats-table th{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:6px 4px;text-align:center;border-bottom:1px solid #1e1e1e;}
.stats-table th:first-child{text-align:left;}
.stats-table td{padding:8px 4px;text-align:center;border-bottom:1px solid #111;}
.stats-table td:first-child{text-align:left;font-weight:600;}
.stats-table tr:last-child td{border-bottom:none;}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.empty-icon{font-size:40px;margin-bottom:12px;}
</style>
</head>
<body>

<!-- LEAGUE OVERLAY -->
<div class="overlay" id="overlay">
  <div style="font-size:11px;font-weight:700;color:var(--orange);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;text-align:center;">SOUTHBAY HOOPS</div>
  <div class="overlay-title">SELECT YOUR LEAGUE</div>
  <div class="overlay-sub">Choose your division to see standings, schedule & stats</div>
  <div onclick="selectLeague('35+ Mens League')" class="league-option">
    <div class="lo-icon">🏀</div>
    <div><div class="lo-name">35+ Men's League</div><div class="lo-sub">Wednesday Nights · 6:30 PM · San Jose</div></div>
  </div>
  <div onclick="selectLeague('40+ Mens League')" class="league-option">
    <div class="lo-icon">🏀</div>
    <div><div class="lo-name">40+ Men's League</div><div class="lo-sub">Night TBD</div></div>
  </div>
  <div onclick="selectLeague('6ft2 Under Division')" class="league-option">
    <div class="lo-icon">🏀</div>
    <div><div class="lo-name">6'2" & Under Division</div><div class="lo-sub">Night TBD</div></div>
  </div>
  <div onclick="selectLeague('Open Division')" class="league-option">
    <div class="lo-icon">🏀</div>
    <div><div class="lo-name">Open Division</div><div class="lo-sub">Night TBD</div></div>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-logo" onclick="showPage('home')">COURT<span>TRACK</span><small>BY YUNG RIZZO</small></div>
  <button class="league-btn" id="league-label" onclick="document.getElementById('overlay').style.display='flex'">Select League</button>
</nav>

<!-- TICKER -->
<div class="ticker-wrap" id="ticker-wrap" style="display:none;">
  <div class="ticker-inner" id="ticker-text">SOUTHBAY HOOPS · SEASON 1 · 2026</div>
</div>

<!-- PAGES -->
<div class="page active" id="page-home"></div>
<div class="page" id="page-schedule"></div>
<div class="page" id="page-standings"></div>
<div class="page" id="page-teams"></div>
<div class="page" id="page-stats"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bnav-btn active" id="bnav-home" onclick="showPage('home')">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
  </button>
  <button class="bnav-btn" id="bnav-schedule" onclick="showPage('schedule')">
    <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>Schedule
  </button>
  <button class="bnav-btn" id="bnav-standings" onclick="showPage('standings')">
    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Standings
  </button>
  <button class="bnav-btn" id="bnav-teams" onclick="showPage('teams')">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>Teams
  </button>
  <button class="bnav-btn" id="bnav-stats" onclick="showPage('stats')">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>Stats
  </button>
</nav>

<script>
// ── FIREBASE ──
firebase.initializeApp({
  apiKey:"AIzaSyAmITPV5C-xbVAqTAJcVsRB7ROO7s_cwzQ",
  authDomain:"court-track-39271.firebaseapp.com",
  databaseURL:"https://court-track-39271-default-rtdb.firebaseio.com",
  projectId:"court-track-39271",
  storageBucket:"court-track-39271.firebasestorage.app",
  messagingSenderId:"559684754695",
  appId:"1:559684754695:web:0d8b12f3519329d8fc79a2"
});
var db = firebase.database();

// ── STATE ──
var teams=[], standings={}, schedule=[], history=[], playerStats={}, game=null, settings={};
var currentLeague = localStorage.getItem('sbh_league') || '';
var currentPage = 'home';

// ── HELPERS ──
function toArr(v){
  if(!v) return [];
  return Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean);
}
function toTeamArr(v){
  if(!v) return [];
  var arr=Array.isArray(v)?v:Object.values(v);
  return arr.filter(Boolean).map(function(t){
    if(t&&t.players&&!Array.isArray(t.players)) t.players=Object.values(t.players);
    if(t&&!t.players) t.players=[];
    return t;
  });
}
function leagueTeams(){
  if(!currentLeague) return teams;
  return teams.filter(function(t){return t.league===currentLeague;});
}
function leagueTeamNames(){
  return leagueTeams().map(function(t){return t.name;});
}

// ── LEAGUE SELECT ──
function selectLeague(league){
  currentLeague = league;
  localStorage.setItem('sbh_league', league);
  document.getElementById('overlay').style.display='none';
  document.getElementById('league-label').textContent = league.replace('Mens League',"Men's League").replace('Under Division',"& Under Division");
  renderAll();
}

// ── NAV ──
function showPage(p){
  currentPage = p;
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.bnav-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  var btn = document.getElementById('bnav-'+p);
  if(btn) btn.classList.add('active');
  renderPage(p);
}

function renderAll(){
  renderPage(currentPage);
  buildTicker();
}

function renderPage(p){
  if(p==='home') renderHome();
  else if(p==='schedule') renderSchedule();
  else if(p==='standings') renderStandings();
  else if(p==='teams') renderTeams();
  else if(p==='stats') renderStats();
}

// ── TICKER ──
function buildTicker(){
  if(!game||!game.active){document.getElementById('ticker-wrap').style.display='none';return;}
  document.getElementById('ticker-wrap').style.display='block';
  var ht=teams[game.hi]||{name:'Home'}, at=teams[game.ai]||{name:'Away'};
  document.getElementById('ticker-text').textContent =
    '🔴 LIVE · '+ht.name+' '+( game.homeScore||0)+' — '+(game.awayScore||0)+' '+at.name+
    ' · H'+(game.q||1)+' · '+formatClock(game.clock)+'  ·  SOUTHBAY HOOPS SEASON 1';
}
function formatClock(clock){
  if(!clock) return '';
  var s=clock.seconds||0;
  return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
}

// ── HOME ──
function renderHome(){
  var el = document.getElementById('page-home');
  var names = leagueTeamNames();
  var html = '<div class="section-title">SOUTHBAY HOOPS</div>';

  // Live game
  if(game && game.active){
    var ht=teams[game.hi]||{name:'Home',color:'#FF4500'};
    var at=teams[game.ai]||{name:'Away',color:'#888'};
    html += '<div class="live-card">'+
      '<div class="live-badge"><div class="live-dot"></div>LIVE NOW</div>'+
      '<div class="live-teams">'+
        '<div class="live-team"><div class="live-tname" style="color:'+ht.color+'">'+ht.name+'</div><div class="live-score">'+( game.homeScore||0)+'</div></div>'+
        '<div class="live-vsep">VS</div>'+
        '<div class="live-team"><div class="live-tname" style="color:'+at.color+'">'+at.name+'</div><div class="live-score" style="color:'+at.color+'">'+( game.awayScore||0)+'</div></div>'+
      '</div>'+
      '<div class="live-meta">H'+(game.q||1)+' · '+formatClock(game.clock)+'</div>'+
    '</div>';
  }

  // Next game
  var now = new Date();
  var upcoming = schedule.filter(function(g){
    return g && !g.isBye && g.status==='upcoming' &&
      (names.length===0||names.indexOf(g.home)>=0||names.indexOf(g.away)>=0);
  });
  if(upcoming.length){
    var next = upcoming[0];
    html += '<div class="card"><div class="card-title">Next Game</div>'+
      '<div style="font-size:15px;font-weight:700;margin-bottom:4px;">'+next.home+' <span style="color:var(--muted);font-weight:400;">vs</span> '+next.away+'</div>'+
      '<div style="font-size:13px;color:var(--muted);">'+next.date+' · '+next.time+'</div>'+
      '</div>';
  }

  // Recent results
  var recent = history.filter(function(g){
    return g && (names.length===0||names.indexOf(g.home)>=0||names.indexOf(g.away)>=0);
  }).slice(0,3);
  if(recent.length){
    html += '<div class="card"><div class="card-title">Recent Results</div>';
    recent.forEach(function(g){
      var hWin = g.homeScore > g.awayScore;
      html += '<div class="game-row">'+
        '<div class="game-teams">'+
          '<span style="font-weight:'+(hWin?'700':'400')+';color:'+(hWin?'var(--white)':'var(--muted)')+'">'+(g.home||'')+'</span>'+
          ' <span style="color:var(--muted);font-size:12px;">vs</span> '+
          '<span style="font-weight:'+(!hWin?'700':'400')+';color:'+(!hWin?'var(--white)':'var(--muted)')+'">'+(g.away||'')+'</span>'+
        '</div>'+
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:var(--orange);">'+(g.homeScore||0)+'–'+(g.awayScore||0)+'</div>'+
      '</div>';
    });
    html += '</div>';
  }

  // Standings mini
  var tms = leagueTeams();
  if(tms.length){
    var sorted = tms.slice().sort(function(a,b){
      var aw=standings[a.name]||{w:0,l:0}, bw=standings[b.name]||{w:0,l:0};
      var ap=(aw.w+aw.l)>0?aw.w/(aw.w+aw.l):0, bp=(bw.w+bw.l)>0?bw.w/(bw.w+bw.l):0;
      return bp-ap;
    }).slice(0,4);
    html += '<div class="card"><div class="card-title">Top Standings</div>';
    sorted.forEach(function(t,i){
      var s=standings[t.name]||{w:0,l:0};
      html += '<div style="display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #111;">'+
        '<span style="font-size:12px;color:var(--muted);min-width:24px;">#'+(i+1)+'</span>'+
        '<div style="width:8px;height:8px;border-radius:50%;background:'+(t.color||'#888')+';margin-right:8px;flex-shrink:0;"></div>'+
        '<span style="flex:1;font-weight:600;font-size:14px;">'+t.name+'</span>'+
        '<span style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;color:var(--orange);">'+s.w+'–'+s.l+'</span>'+
      '</div>';
    });
    html += '</div>';
  }

  el.innerHTML = html;
}

// ── SCHEDULE ──
function renderSchedule(){
  var el = document.getElementById('page-schedule');
  var names = leagueTeamNames();
  var filtered = schedule.filter(function(g){
    if(!g) return false;
    if(g.isBye) return names.length===0||names.indexOf(g.home)>=0;
    return names.length===0||names.indexOf(g.home)>=0||names.indexOf(g.away)>=0;
  });

  if(!filtered.length){
    el.innerHTML='<div class="section-title">SCHEDULE</div><div class="empty"><div class="empty-icon">📅</div>Schedule coming soon!</div>';
    return;
  }

  // Group by round
  var rounds={};
  filtered.forEach(function(g){
    var r=g.round||1;
    if(!rounds[r]) rounds[r]=[];
    rounds[r].push(g);
  });

  var html = '<div class="section-title">SCHEDULE</div>';

  Object.keys(rounds).sort(function(a,b){return a-b;}).forEach(function(r){
    var games = rounds[r];
    var byeGame = games.find(function(g){return g.isBye;});
    var realGames = games.filter(function(g){return !g.isBye;});
    var isPlayoff = realGames.length && realGames[0].isPlayoff;
    var date = realGames.length ? realGames[0].date : (byeGame?byeGame.date:'');

    html += '<div class="game-day'+(isPlayoff?' playoff-day':'')+'">'+
      '<div class="game-day-header">'+
        '<span>'+(isPlayoff?'🏆 PLAYOFFS':('GAME DAY '+r))+' · '+date+'</span>'+
        (byeGame&&!isPlayoff?'<span class="bye-label">BYE: '+byeGame.home+'</span>':'')+ 
      '</div>';

    realGames.forEach(function(g){
      var isFinal = g.status==='final';
      var ht=teams.find(function(t){return t.name===g.home;})||{color:'#FF4500'};
      var at=teams.find(function(t){return t.name===g.away;})||{color:'#888'};
      html += '<div class="game-row">'+
        '<div class="game-time">'+g.time+'</div>'+
        '<div class="game-teams">'+
          '<span style="color:'+(ht.color||'#FF4500')+';font-weight:700;">'+(g.home||'TBD')+'</span>'+
          '<span class="game-vs">vs</span>'+
          '<span style="color:'+(at.color||'#888')+';font-weight:700;">'+(g.away||'TBD')+'</span>'+
        '</div>'+
        (isFinal?'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:var(--orange);">'+g.homeScore+'–'+g.awayScore+'</div>':'')+
        '<div class="game-status status-'+(isFinal?'final':'upcoming')+'">'+(isFinal?'Final':'Upcoming')+'</div>'+
      '</div>';
    });
    html += '</div>';
  });

  // Playoff bracket
  html += '<div class="section-title" style="margin-top:24px;">PLAYOFF BRACKET</div>';
  html += '<div class="bracket-wrap"><div class="bracket">';
  html += '<div class="b-round">';
  html += '<div class="b-label">SEMIFINALS · AUG 19</div>';
  html += '<div class="b-match"><div class="b-team"><span class="b-seed">#1</span>TBD</div><div class="b-team"><span class="b-seed">#4</span>TBD</div><div class="b-date">WED · AUG 19 · 6:30 PM</div></div>';
  html += '<div style="height:20px;"></div>';
  html += '<div class="b-match"><div class="b-team"><span class="b-seed">#2</span>TBD</div><div class="b-team"><span class="b-seed">#3</span>TBD</div><div class="b-date">WED · AUG 19 · 7:30 PM</div></div>';
  html += '</div>';
  html += '<div style="width:32px;"></div>';
  html += '<div class="b-round">';
  html += '<div class="b-label">CHAMPIONSHIP · AUG 26</div>';
  html += '<div style="height:30px;"></div>';
  html += '<div class="b-champ"><div class="b-champ-icon">🏆</div><div class="b-champ-label">CHAMPION</div><div class="b-champ-date">WED · AUG 26 · 6:30 PM</div></div>';
  html += '</div>';
  html += '</div></div>';

  html += '<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:16px;padding-bottom:20px;">Top 4 teams advance · Championship rings for winners 🏆</div>';

  el.innerHTML = html;
}

// ── STANDINGS ──
function renderStandings(){
  var el = document.getElementById('page-standings');
  var tms = leagueTeams();
  if(!tms.length){
    el.innerHTML='<div class="section-title">STANDINGS</div><div class="empty"><div class="empty-icon">📊</div>No teams yet</div>';
    return;
  }

  var sorted = tms.slice().sort(function(a,b){
    var as=standings[a.name]||{w:0,l:0,pts:0,ptsA:0};
    var bs=standings[b.name]||{w:0,l:0,pts:0,ptsA:0};
    var ag=(as.w+as.l), bg=(bs.w+bs.l);
    var ap=ag>0?as.w/ag:0, bp=bg>0?bs.w/bg:0;
    if(bp!==ap) return bp-ap;
    var adiff=(as.pts||0)-(as.ptsA||0), bdiff=(bs.pts||0)-(bs.ptsA||0);
    return bdiff-adiff;
  });

  var html = '<div class="section-title">STANDINGS</div>';
  html += '<div class="card"><table class="standings-table"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>WIN%</th><th>+/-</th></tr></thead><tbody>';

  sorted.forEach(function(t,i){
    var s=standings[t.name]||{w:0,l:0,pts:0,ptsA:0};
    var g=s.w+s.l;
    var pct=g>0?(s.w/g).toFixed(3).replace('0.','.'):'—';
    var diff=(s.pts||0)-(s.ptsA||0);
    var isPlayoffLine = i===3;
    html += '<tr'+(isPlayoffLine?' class="playoff-line"':'')+'>'+
      '<td><span class="rank-num">'+(i+1)+'</span></td>'+
      '<td><div style="display:flex;align-items:center;gap:6px;"><div style="width:8px;height:8px;border-radius:50%;background:'+(t.color||'#888')+';"></div>'+t.name+'</div></td>'+
      '<td style="color:var(--green);font-weight:700;">'+s.w+'</td>'+
      '<td style="color:#ef4444;">'+s.l+'</td>'+
      '<td>'+pct+'</td>'+
      '<td style="color:'+(diff>=0?'var(--green)':'#ef4444')+'">'+(diff>0?'+':'')+diff+'</td>'+
    '</tr>';
  });

  html += '</tbody></table>';
  html += '<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--orange);letter-spacing:1px;">— TOP 4 ADVANCE TO PLAYOFFS —</div>';
  html += '</div>';
  el.innerHTML = html;
}

// ── TEAMS ──
function renderTeams(){
  var el = document.getElementById('page-teams');
  var tms = leagueTeams();
  if(!tms.length){
    el.innerHTML='<div class="section-title">TEAMS</div><div class="empty"><div class="empty-icon">🏀</div>No teams loaded yet</div>';
    return;
  }
  var html = '<div class="section-title">TEAMS</div>';
  tms.forEach(function(t){
    html += '<div class="team-card">'+
      '<div class="team-header">'+
        '<div class="team-dot" style="background:'+(t.color||'#888')+'"></div>'+
        '<div class="team-name-h">'+t.name+'</div>'+
        '<div style="margin-left:auto;font-size:12px;color:var(--muted);">'+(t.players?t.players.length:0)+' players</div>'+
      '</div>'+
      '<div class="player-list">';
    (t.players||[]).forEach(function(p){
      html += '<div class="player-tag">#'+(p.num||'?')+' '+p.name+'</div>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
}

// ── STATS ──
function renderStats(){
  var el = document.getElementById('page-stats');
  var names = leagueTeamNames();
  var allStats = [];

  (names.length?leagueTeams():teams).forEach(function(t){
    (t.players||[]).forEach(function(p){
      var ps = (playerStats[t.name]&&playerStats[t.name][p.num]) ||
               (playerStats[t.name]&&playerStats[t.name][String(p.num)]) || {};
      if((ps.pts||0)+(ps.reb||0)+(ps.ast||0) > 0){
        allStats.push({name:p.name,team:t.name,color:t.color,num:p.num,
          pts:ps.pts||0,reb:ps.reb||0,ast:ps.ast||0,stl:ps.stl||0,blk:ps.blk||0,gp:ps.gp||0});
      }
    });
  });

  if(!allStats.length){
    el.innerHTML='<div class="section-title">PLAYER STATS</div><div class="empty"><div class="empty-icon">📈</div>Stats will appear after games are played</div>';
    return;
  }

  allStats.sort(function(a,b){return b.pts-a.pts;});
  var html = '<div class="section-title">PLAYER STATS</div>';
  html += '<div class="card" style="overflow-x:auto;"><table class="stats-table"><thead><tr><th>Player</th><th>Team</th><th>GP</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr></thead><tbody>';
  allStats.forEach(function(p){
    html += '<tr>'+
      '<td><span style="color:var(--muted);font-size:11px;">#'+p.num+'</span> '+p.name+'</td>'+
      '<td><span style="color:'+(p.color||'#888')+';font-size:12px;">'+p.team+'</span></td>'+
      '<td>'+p.gp+'</td>'+
      '<td style="font-weight:700;color:var(--orange);">'+p.pts+'</td>'+
      '<td>'+p.reb+'</td><td>'+p.ast+'</td><td>'+p.stl+'</td><td>'+p.blk+'</td>'+
    '</tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

// ── FIREBASE LISTENERS ──
db.ref('ct/teams').on('value',function(s){
  teams=toTeamArr(s.val());
  renderAll();
});
db.ref('ct/standings').on('value',function(s){
  standings=s.val()||{};
  renderAll();
});
db.ref('ct/schedule').on('value',function(s){
  schedule=toArr(s.val());
  renderAll();
});
db.ref('ct/history').on('value',function(s){
  var v=s.val();
  if(!v){history=[];}
  else if(Array.isArray(v)){history=v.filter(Boolean);}
  else{history=Object.values(v).filter(Boolean);}
  history.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});
  renderAll();
});
db.ref('ct/playerStats').on('value',function(s){
  playerStats=s.val()||{};
  renderAll();
});
db.ref('ct/game').on('value',function(s){
  game=s.val()||null;
  buildTicker();
  if(currentPage==='home') renderHome();
});
db.ref('ct/settings').on('value',function(s){
  settings=s.val()||{};
});

// ── INIT ──
if(!currentLeague){
  document.getElementById('overlay').style.display='flex';
} else {
  document.getElementById('overlay').style.display='none';
  document.getElementById('league-label').textContent = currentLeague.replace('Mens League',"Men's League").replace('Under Division',"& Under Division");
}
