<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourtTrack Player</title>
<style>
:root{--orange:#FF5C00;--dark:#0a0a0a;--dark2:#141414;--muted:#8a8a8a;--light:#f0f0f0;--white:#fff;--line:#262626;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:var(--dark);color:var(--light);}
nav{background:var(--dark2);padding:1rem;border-bottom:1px solid var(--line);sticky:top;display:flex;gap:1rem;flex-wrap:wrap;}
.nav-tab{background:transparent;color:var(--muted);border:none;padding:0.5rem 1rem;cursor:pointer;font-weight:600;}
.nav-tab.active{color:var(--orange);}
.nav-tab:hover{color:var(--light);}
.page{display:none;padding:2rem;max-width:1000px;margin:0 auto;}
.page.active{display:block;}
h2{color:var(--white);font-size:28px;margin-bottom:2rem;font-weight:900;}
.game-card{background:var(--dark2);border:1px solid var(--line);padding:16px;margin-bottom:12px;border-radius:8px;cursor:pointer;}
.game-card:hover{border-color:var(--orange);}
.game-header{display:flex;justify-content:space-between;align-items:center;}
.game-title{font-size:16px;font-weight:600;color:var(--white);}
.game-date{font-size:11px;color:var(--muted);margin-top:4px;}
.game-score{font-size:28px;font-weight:900;color:var(--white);}
.game-detail{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.game-detail.open{display:block;}
table{width:100%;font-size:12px;border-collapse:collapse;margin-top:12px;}
th{background:var(--dark3);padding:8px;text-align:left;font-weight:600;color:var(--muted);}
td{padding:8px;border-bottom:1px solid var(--line);}
.pts{color:var(--orange);font-weight:700;text-align:right;}
</style>
</head>
<body>

<nav>
  <button class="nav-tab active" onclick="showTab('home')">🏀 Home</button>
  <button class="nav-tab" onclick="showTab('scores')">📊 Scores</button>
</nav>

<div class="page active" id="tab-home">
  <h2>CourtTrack</h2>
  <p style="color:var(--muted);">Click Scores to view game statistics.</p>
</div>

<div class="page" id="tab-scores">
  <h2>Scores</h2>
  <div id="games-container">Loading...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
var db;
var gameHistory=[];

firebase.initializeApp({
  apiKey:"AIzaSyDRWr9Bvx1nZ6g3H8K9L0M1N2O3P4Q5R6S",
  authDomain:"court-track-39271.firebaseapp.com",
  databaseURL:"https://court-track-39271-default-rtdb.firebaseio.com",
  projectId:"court-track-39271"
});

db=firebase.database();
db.ref('ct/history').on('value',function(snap){
  gameHistory=snap.val()||[];
  console.log('Games loaded:',gameHistory.length);
});

function showTab(tab){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  event.target.classList.add('active');
  
  if(tab==='scores') renderScores();
}

function renderScores(){
  var el=document.getElementById('games-container');
  var games=Array.isArray(gameHistory)?gameHistory:Object.values(gameHistory||{});
  games=games.filter(g=>g&&g.home&&g.away);
  
  if(!games.length){
    el.innerHTML='<p style="color:var(--muted);">No games yet</p>';
    return;
  }
  
  games.reverse();
  var html='';
  games.forEach((g,i)=>{
    html+='<div class="game-card" onclick="toggleDetail('+i+')">';
    html+='<div class="game-header">';
    html+='<div><div class="game-title">'+g.home+' vs '+g.away+'</div><div class="game-date">'+g.date+'</div></div>';
    html+='<div class="game-score">'+g.homeScore+'-'+g.awayScore+'</div>';
    html+='</div>';
    html+='<div class="game-detail" id="detail-'+i+'">';
    
    // Home team
    html+='<h3 style="color:var(--orange);font-size:13px;margin-bottom:8px;margin-top:12px;">'+g.home+'</h3>';
    html+='<table><tr><th>Player</th><th>PTS</th><th>REB</th><th>AST</th></tr>';
    if(g.homePlayers&&g.hStats){
      (Array.isArray(g.homePlayers)?g.homePlayers:Object.values(g.homePlayers||{})).forEach(p=>{
        var s=g.hStats[p.num]||{};
        html+='<tr><td>#'+p.num+' '+p.name+'</td><td class="pts">'+(s.pts||0)+'</td><td>'+(s.reb||0)+'</td><td>'+(s.ast||0)+'</td></tr>';
      });
    }
    html+='</table>';
    
    // Away team
    html+='<h3 style="color:var(--orange);font-size:13px;margin-bottom:8px;margin-top:16px;">'+g.away+'</h3>';
    html+='<table><tr><th>Player</th><th>PTS</th><th>REB</th><th>AST</th></tr>';
    if(g.awayPlayers&&g.aStats){
      (Array.isArray(g.awayPlayers)?g.awayPlayers:Object.values(g.awayPlayers||{})).forEach(p=>{
        var s=g.aStats[p.num]||{};
        html+='<tr><td>#'+p.num+' '+p.name+'</td><td class="pts">'+(s.pts||0)+'</td><td>'+(s.reb||0)+'</td><td>'+(s.ast||0)+'</td></tr>';
      });
    }
    html+='</table>';
    
    html+='</div></div>';
  });
  el.innerHTML=html;
}

function toggleDetail(i){
  var detail=document.getElementById('detail-'+i);
  if(detail) detail.classList.toggle('open');
}
</script>

</body>
</html>
