<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourtTrack — Player View</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF5C00;--dark:#0d0d0d;--dark2:#161616;--dark3:#1e1e1e;--dark4:#272727;--muted:#888;--light:#f0f0f0;--white:#fff;--green:#22c55e;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--light);min-height:100vh;}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;background:var(--dark2);border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap;}
.nav-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:1px;color:var(--white);line-height:1;}
.nav-logo span{color:var(--orange);}
.nav-logo small{display:block;font-size:9px;font-weight:600;letter-spacing:2px;color:var(--muted);line-height:1;margin-top:2px;}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.nav-tab{padding:6px 13px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--muted);border:none;transition:all 0.15s;font-family:'Barlow',sans-serif;}
.nav-tab:hover{color:var(--light);background:var(--dark3);}
.nav-tab.active{background:var(--orange);color:#fff;}
.page{display:none;padding:2rem;max-width:1100px;margin:0 auto;}
.page.active{display:block;}
.loading{padding:80px 20px;text-align:center;color:var(--muted);font-size:14px;}
.no-game{padding:60px 20px;text-align:center;color:var(--muted);}
.no-game h2{font-size:24px;color:var(--light);margin-bottom:8px;}
.stats-card{background:var(--dark2);border:1px solid #2a2a2a;border-radius:10px;overflow:hidden;margin-bottom:1.5rem;}
.stats-card-header{padding:14px 20px;border-bottom:1px solid #2a2a2a;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
table{width:100%;border-collapse:collapse;}
th{padding:8px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:right;border-bottom:1px solid #2a2a2a;white-space:nowrap;}
th:first-child,th:nth-child(2){text-align:left;}
td{padding:10px 12px;font-size:13px;color:var(--light);text-align:right;border-bottom:1px solid #1c1c1c;white-space:nowrap;}
td:first-child{color:var(--muted);font-size:12px;font-weight:700;text-align:left;}
td:nth-child(2){font-weight:600;color:var(--white);text-align:left;}
td.pts-cell{color:var(--orange);font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:16px;}
td.win{color:var(--green);font-weight:700;}
td.loss{color:var(--red);font-weight:700;}
td.diff-pos{color:var(--green);}
td.diff-neg{color:var(--red);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;}
.rank-1{background:rgba(245,166,35,0.15);color:#f5a623;}
.rank-2{background:rgba(176,176,176,0.1);color:#b0b0b0;}
.rank-3{background:rgba(205,127,50,0.1);color:#cd7f32;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.hero-banner{background:linear-gradient(135deg,#1a0a00 0%,#0d0d0d 60%);border:1px solid #2a2a2a;border-radius:12px;padding:2.5rem;margin-bottom:2rem;position:relative;overflow:hidden;}
.hero-bg-text{position:absolute;right:2rem;top:50%;transform:translateY(-50%);font-family:'Barlow Condensed',sans-serif;font-size:96px;font-weight:900;color:rgba(255,92,0,0.06);pointer-events:none;white-space:nowrap;}
.hero-subtitle{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;color:var(--white);line-height:1;margin-bottom:10px;}
.hero-meta{font-size:13px;color:var(--muted);}
.score-row{display:flex;gap:16px;margin-bottom:2rem;justify-content:center;flex-wrap:wrap;}
.score-box{text-align:center;background:var(--dark2);border:1px solid #2a2a2a;border-radius:12px;padding:1.5rem 2.5rem;}
.score-name{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.score-num{font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:900;}
.score-vs{display:flex;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:28px;color:#333;font-weight:900;}
.highlights{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
@media(max-width:700px){.highlights{grid-template-columns:repeat(2,1fr)!important;}.lb-two{grid-template-columns:1fr!important;}}
.stat-card{background:var(--dark2);border:1px solid #2a2a2a;border-radius:10px;padding:1.25rem;}
.sc-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.sc-val{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--white);line-height:1;}
.sc-name{font-size:12px;color:var(--muted);margin-top:4px;}
.stat-card.hl{border-color:rgba(255,92,0,0.4);background:rgba(255,92,0,0.06);}
.stat-card.hl .sc-val{color:var(--orange);}
.lb-two{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #1c1c1c;}
.lb-row:last-child{border-bottom:none;}
.lb-rank{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:var(--muted);min-width:20px;text-align:center;}
.lb-rank.r1{color:#f5a623;}.lb-rank.r2{color:#b0b0b0;}.lb-rank.r3{color:#cd7f32;}
.lb-avatar{width:32px;height:32px;border-radius:50%;background:var(--dark4);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;flex-shrink:0;}
.lb-info{flex:1;}
.lb-name{font-size:14px;font-weight:600;color:var(--white);}
.lb-sub{font-size:11px;color:var(--muted);}
.lb-stat{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--white);min-width:48px;text-align:right;}
.lb-stat-label{font-size:10px;color:var(--muted);text-align:right;}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
.team-card{background:var(--dark2);border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;}
.team-card-header{padding:16px 20px;display:flex;align-items:center;gap:12px;}
.team-card-badge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:#fff;flex-shrink:0;}
.team-card-name{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--white);}
.team-card-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.team-card-stats{padding:12px 20px;border-top:1px solid #2a2a2a;display:flex;gap:16px;}
.tc-stat{flex:1;text-align:center;}
.tc-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--white);}
.tc-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.schedule-week{margin-bottom:1.5rem;}
.schedule-week-header{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:8px 0;border-bottom:1px solid #2a2a2a;margin-bottom:8px;}
.schedule-game-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--dark3);border:1px solid #2a2a2a;border-radius:8px;margin-bottom:6px;flex-wrap:wrap;}
.sgr-date{font-size:12px;color:var(--muted);min-width:100px;}
.sgr-time{font-size:12px;color:var(--muted);min-width:60px;}
.sgr-teams{flex:1;font-size:14px;font-weight:600;}
.sgr-location{font-size:12px;color:var(--muted);}
.sgr-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:1px;}
.sgr-status.upcoming{background:rgba(59,130,246,0.15);color:#7ab8f5;}
.sgr-status.final{background:rgba(34,197,94,0.1);color:var(--green);}
.search-bar{background:var(--dark3);border:1px solid #333;border-radius:8px;color:var(--white);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 14px;width:100%;outline:none;margin-bottom:1.2rem;}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.footer-bar{margin-top:2rem;padding:14px 20px;background:var(--dark2);border:1px solid #2a2a2a;border-radius:10px;font-size:12px;color:var(--muted);text-align:center;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">COURT<span>TRACK</span><small>by YUNG RIZZO</small></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('live')">🔴 Live</button>
    <button class="nav-tab" onclick="showTab('schedule')">📅 Schedule</button>
    <button class="nav-tab" onclick="showTab('standings')">🏆 Standings</button>
    <button class="nav-tab" onclick="showTab('teams')">🏀 Teams</button>
    <button class="nav-tab" onclick="showTab('players')">👤 Players</button>
  </div>
</nav>
<div class="page active" id="tab-live"><div class="loading">🏀 Loading…</div></div>
<div class="page" id="tab-schedule"><div class="loading">Loading schedule…</div></div>
<div class="page" id="tab-standings"><div class="loading">Loading standings…</div></div>
<div class="page" id="tab-teams"><div class="loading">Loading teams…</div></div>
<div class="page" id="tab-players">
  <h2 style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:4px;">Players</h2>
  <p style="font-size:13px;color:var(--muted);margin-bottom:1.2rem;">Season stats — sorted by points.</p>
  <input class="search-bar" id="p-search" placeholder="🔍 Search by name or team..." oninput="renderPlayers()"/>
  <div class="stats-card">
    <table><thead><tr><th>#</th><th>Player</th><th style="text-align:left;">Team</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>GP</th></tr></thead>
    <tbody id="p-body"></tbody></table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
var db;
try {
  firebase.initializeApp({
    apiKey:"AIzaSyAmITPV5C-xbVAqTAJcVsRB7ROO7s_cwzQ",
    authDomain:"court-track-39271.firebaseapp.com",
    databaseURL:"https://court-track-39271-default-rtdb.firebaseio.com",
    projectId:"court-track-39271",
    storageBucket:"court-track-39271.firebasestorage.app",
    messagingSenderId:"559684754695",
    appId:"1:559684754695:web:0d8b12f3519329d8fc79a2"
  });
  db=firebase.database();
} catch(e){ db=firebase.database(); }

var teams=[],game=null,standings={},history=[],playerStats={},schedule=[];
var currentTab='live', _ready=false;

function teamInitials(n){return n.split(' ').map(function(w){return w[0];}).join('').slice(0,3).toUpperCase()||'??';}

function toArr(v){
  if(!v) return [];
  var arr=Array.isArray(v)?v:Object.values(v);
  return arr.map(function(t){
    if(t&&t.players&&!Array.isArray(t.players)) t.players=Object.values(t.players);
    if(t&&!t.players) t.players=[];
    return t;
  });
}

// ── Load all data then start ──
var _loaded=0, _booted=false;
function _check(){if(++_loaded>=6 && !_booted){_booted=true;_ready=true;showTab('live');}}
setTimeout(function(){if(!_booted){_booted=true;_ready=true;showTab('live');}},2500);
db.ref('ct/teams').once('value').then(function(s){teams=toArr(s.val());_check();}).catch(function(){_check();});
db.ref('ct/standings').once('value').then(function(s){standings=s.val()||{};_check();}).catch(function(){_check();});
db.ref('ct/history').once('value').then(function(s){history=toArr(s.val());_check();}).catch(function(){_check();});
db.ref('ct/playerStats').once('value').then(function(s){playerStats=s.val()||{};_check();}).catch(function(){_check();});
db.ref('ct/schedule').once('value').then(function(s){schedule=toArr(s.val());_check();}).catch(function(){_check();});
db.ref('ct/game').once('value').then(function(s){game=s.val()||null;_check();}).catch(function(){_check();});
db.ref('ct/game').on('value',function(s){
  game=s.val()||null;
  if(_ready&&currentTab==='live') renderLive();
});

// ── LIVE ──
function renderLive(){
  var el=document.getElementById('tab-live');
  if(!game){
    el.innerHTML='<div class="no-game"><div style="font-size:48px;margin-bottom:16px;">🏀</div><h2>No game in progress</h2><p>Check back when a game has started.</p></div>';
    return;
  }
  var ht=teams[game.hi],at=teams[game.ai];
  if(!ht||!at){el.innerHTML='<div class="no-game"><h2>Game data unavailable.</h2></div>';return;}
  var all=[];
  ht.players.forEach(function(p){all.push({name:p.name,num:p.num,st:game.hStats[p.num]||{},team:ht.name,color:ht.color||'#FF5C00'});});
  at.players.forEach(function(p){all.push({name:p.name,num:p.num,st:game.aStats[p.num]||{},team:at.name,color:at.color||'#888'});});
  var byPts=all.slice().sort(function(a,b){return (b.st.pts||0)-(a.st.pts||0);});
  var byReb=all.slice().sort(function(a,b){return (b.st.reb||0)-(a.st.reb||0);});
  var byAst=all.slice().sort(function(a,b){return (b.st.ast||0)-(a.st.ast||0);});
  function lbH(sorted,key){
    return sorted.slice(0,5).map(function(p,i){
      var ini=p.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2);
      return '<div class="lb-row"><div class="lb-rank '+(i===0?'r1':i===1?'r2':i===2?'r3':'')+'">'+(i+1)+'</div>'
        +'<div class="lb-avatar" style="color:'+p.color+'">'+ini+'</div>'
        +'<div class="lb-info"><div class="lb-name">'+p.name+'</div><div class="lb-sub">'+p.team+' · #'+p.num+'</div></div>'
        +'<div><div class="lb-stat">'+(p.st[key]||0)+'</div><div class="lb-stat-label">'+key.toUpperCase()+'</div></div></div>';
    }).join('');
  }
  var allS=all.slice().sort(function(a,b){return a.team.localeCompare(b.team)||(b.st.pts||0)-(a.st.pts||0);});
  el.innerHTML='<div style="margin-bottom:12px;"><span style="display:inline-block;background:#1a3a5c;color:#7ab8f5;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:1px;text-transform:uppercase;">👁 Live Game</span></div>'
    +'<div class="hero-banner"><div class="hero-bg-text">'+ht.name.toUpperCase()+'</div>'
    +'<div class="hero-subtitle">Live Game Stats</div>'
    +'<div class="hero-title">'+ht.name+' vs '+at.name+'</div>'
    +'<div class="hero-meta">'+game.date+' · H'+game.q+'</div></div>'
    +'<div class="score-row">'
    +'<div class="score-box"><div class="score-name">'+ht.name+'</div><div class="score-num" style="color:'+(ht.color||'var(--orange)')+'">'+game.homeScore+'</div></div>'
    +'<div class="score-vs">vs</div>'
    +'<div class="score-box"><div class="score-name">'+at.name+'</div><div class="score-num" style="color:'+(at.color||'var(--white)')+'">'+game.awayScore+'</div></div>'
    +'</div>'
    +'<div class="highlights">'
    +'<div class="stat-card hl"><div class="sc-label">Points Leader</div><div class="sc-val">'+(byPts[0]?byPts[0].st.pts||0:0)+'</div><div class="sc-name">'+(byPts[0]?byPts[0].name:'—')+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Reb Leader</div><div class="sc-val">'+(byReb[0]?byReb[0].st.reb||0:0)+'</div><div class="sc-name">'+(byReb[0]?byReb[0].name:'—')+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Ast Leader</div><div class="sc-val">'+(byAst[0]?byAst[0].st.ast||0:0)+'</div><div class="sc-name">'+(byAst[0]?byAst[0].name:'—')+'</div></div>'
    +'<div class="stat-card"><div class="sc-label">Half</div><div class="sc-val">H'+game.q+'</div><div class="sc-name">Current</div></div>'
    +'</div>'
    +'<div class="lb-two">'
    +'<div><div class="section-label" style="margin-bottom:10px;">Points Leaders</div><div class="stats-card">'+lbH(byPts,'pts')+'</div></div>'
    +'<div><div class="section-label" style="margin-bottom:10px;">Rebounds Leaders</div><div class="stats-card">'+lbH(byReb,'reb')+'</div></div>'
    +'<div><div class="section-label" style="margin-bottom:10px;">Assists Leaders</div><div class="stats-card">'+lbH(byAst,'ast')+'</div></div>'
    +'<div><div class="section-label" style="margin-bottom:10px;">Full Box Score</div>'
    +'<div class="stats-card"><table><thead><tr><th>#</th><th>Player</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th></tr></thead><tbody>'
    +allS.map(function(p){return '<tr><td><span style="color:'+p.color+'">#'+p.num+'</span></td><td>'+p.name+'</td><td class="pts-cell">'+(p.st.pts||0)+'</td><td>'+(p.st.reb||0)+'</td><td>'+(p.st.ast||0)+'</td><td>'+(p.st.stl||0)+'</td><td>'+(p.st.to||0)+'</td></tr>';}).join('')
    +'</tbody></table></div></div></div>'
    +'<div class="footer-bar"><span class="live-dot"></span>Stats update automatically in real time</div>';
}

// ── SCHEDULE ──
function renderSchedule(){
  var el=document.getElementById('tab-schedule');
  if(!schedule.length){el.innerHTML='<div style="padding:2rem;"><h2 style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:1rem;">Schedule</h2><p style="color:var(--muted);font-style:italic;">No schedule generated yet.</p></div>';return;}
  var rounds={};
  schedule.forEach(function(g,i){var r=g.round||1;if(!rounds[r])rounds[r]=[];rounds[r].push({g:g,i:i});});
  var html='<h2 style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:1.5rem;">Schedule</h2>';
  Object.keys(rounds).sort(function(a,b){return a-b;}).forEach(function(r){
    html+='<div class="schedule-week"><div class="schedule-week-header">Week '+r+'</div>';
    rounds[r].forEach(function(item){
      var g=item.g;
      if(g.isBye){
        html+='<div class="schedule-game-row" style="opacity:0.6;">'
          +'<span class="sgr-date">'+g.date+'</span><span class="sgr-time">'+g.time+'</span>'
          +'<span class="sgr-teams"><span style="color:'+g.homeColor+';font-weight:700;">'+g.home+'</span> — <span style="color:#555;font-weight:700;">BYE</span></span>'
          +'<span class="sgr-location">📍 '+g.location+'</span>'
          +'<span class="sgr-status" style="background:rgba(136,136,136,0.1);color:var(--muted);">Bye</span></div>';
      } else {
        var isFinal=g.status==='final';
        var resultHtml=isFinal?'<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:900;color:'+(g.homeScore>g.awayScore?g.homeColor:g.awayColor)+'">'+g.homeScore+'–'+g.awayScore+'</span>':'';
        html+='<div class="schedule-game-row">'
          +'<span class="sgr-date">'+g.date+'</span><span class="sgr-time">'+g.time+'</span>'
          +'<span class="sgr-teams"><span style="color:'+g.homeColor+';font-weight:700;">'+g.home+'</span> <span style="color:var(--muted);">vs</span> <span style="color:'+g.awayColor+';font-weight:700;">'+g.away+'</span></span>'
          +'<span class="sgr-location">📍 '+g.location+'</span>'
          +resultHtml
          +'<span class="sgr-status '+(isFinal?'final':'upcoming')+'">'+(isFinal?'Final':'Upcoming')+'</span></div>';
      }
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

// ── STANDINGS ──
function renderStandings(){
  var el=document.getElementById('tab-standings');
  // standings is a plain object keyed by team name — safe to use Object.keys
  var entries=[];
  try {
    entries=Object.keys(standings).map(function(name){
      var s=standings[name]||{}; var gp=(s.w||0)+(s.l||0), diff=(s.pf||0)-(s.pa||0);
      return {name:name,w:s.w||0,l:s.l||0,gp:gp,pf:s.pf||0,pa:s.pa||0,diff:diff,
        pct:gp>0?((s.w||0)/gp).toFixed(3).replace(/^0/,''):'.000',
        ppg:gp>0?((s.pf||0)/gp).toFixed(1):'0.0',color:s.color||'#FF5C00'};
    }).sort(function(a,b){return b.w-a.w||b.diff-a.diff;});
  } catch(e){ entries=[]; }

  // history — ensure it's an array
  var hist=[];
  try {
    if(Array.isArray(history)) hist=history;
    else if(history&&typeof history==='object') hist=Object.values(history);
  } catch(e){ hist=[]; }

  var histHtml='';
  if(hist.length){
    histHtml=hist.map(function(g){
      if(!g) return '';
      var winner=(g.homeScore||0)>(g.awayScore||0)?g.home:g.away;
      return '<div style="display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--dark3);border:1px solid #2a2a2a;border-radius:8px;margin-bottom:8px;flex-wrap:wrap;">'
        +'<div style="font-size:12px;color:var(--muted);min-width:110px;">'+(g.date||'')+'</div>'
        +'<div style="flex:1;font-size:14px;font-weight:600;"><span style="color:'+(g.homeColor||'#fff')+'">'+(g.home||'')+'</span> <span style="color:var(--muted);">vs</span> <span style="color:'+(g.awayColor||'#888')+'">'+(g.away||'')+'</span></div>'
        +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:900;">'+(g.homeScore||0)+' — '+(g.awayScore||0)+'</div>'
        +'<div style="font-size:12px;font-weight:700;color:var(--green);">W: '+winner+'</div></div>';
    }).join('');
  } else {
    histHtml='<p style="color:var(--muted);font-size:13px;font-style:italic;">No games completed yet.</p>';
  }
  el.innerHTML='<h2 style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:1.5rem;">Standings</h2>'
    +'<div class="stats-card" style="margin-bottom:2rem;">'
    +'<table><thead><tr><th style="text-align:left;width:36px;">RK</th><th style="text-align:left;">Team</th><th>W</th><th>L</th><th>PCT</th><th>GP</th><th>PF</th><th>PA</th><th>+/-</th><th>PPG</th></tr></thead><tbody>'
    +(entries.length?entries.map(function(e,i){
      var rk=i+1,rkHtml=rk<=3?'<span class="rank-badge rank-'+rk+'">'+rk+'</span>':'<span style="color:var(--muted);font-size:13px;font-weight:700;">'+rk+'</span>';
      var dc=e.diff>0?'diff-pos':e.diff<0?'diff-neg':'';
      return '<tr><td>'+rkHtml+'</td>'
        +'<td><span style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;" onclick="openTeamDetail(\''+e.name.replace(/'/g,"\\'")+'\')"><span style="width:10px;height:10px;border-radius:50%;background:'+e.color+';flex-shrink:0;"></span><span style="text-decoration:underline;color:var(--white);">'+e.name+'</span></span></td>'
        +'<td class="win">'+e.w+'</td><td class="loss">'+e.l+'</td><td>'+e.pct+'</td><td>'+e.gp+'</td>'
        +'<td>'+e.pf+'</td><td>'+e.pa+'</td><td class="'+dc+'">'+(e.diff>0?'+':'')+e.diff+'</td><td>'+e.ppg+'</td></tr>';
    }).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:32px;font-style:italic;">No completed games yet.</td></tr>')
    +'</tbody></table></div>'
    +'<h3 style="font-size:20px;font-weight:700;color:var(--white);margin-bottom:12px;">Game History</h3>'+histHtml;
}

// ── TEAM DETAIL ──
function openTeamDetail(name){
  showTab('players');
  document.getElementById('p-search').value=name;
  renderPlayers();
  window.scrollTo(0,0);
  var team=teams.find(function(t){return t.name===name;});
  var st=standings[name]||{w:0,l:0,pf:0,pa:0};
  var ps=playerStats[name]||{};
  var color=(team&&team.color)||'#FF5C00';
  var gp=st.w+st.l;
  var tP=0,tR=0,tA=0,tS=0,tB=0;
  Object.keys(ps).forEach(function(k){var p=ps[k];tP+=p.pts||0;tR+=p.reb||0;tA+=p.ast||0;tS+=p.stl||0;tB+=p.blk||0;});
  var banner='<div id="team-banner" style="background:var(--dark2);border:1px solid '+color+';border-radius:12px;padding:16px 20px;margin-bottom:1rem;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'
    +'<div style="width:48px;height:48px;border-radius:10px;background:'+color+';display:flex;align-items:center;justify-content:center;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:20px;color:#fff;flex-shrink:0;">'+teamInitials(name)+'</div>'
    +'<div style="flex:1;">'
    +'<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:var(--white);">'+name+'</div>'
    +'<div style="font-size:11px;color:var(--muted);">'+(team?team.players.length:0)+' players · '+gp+' game'+(gp!==1?'s':'')+' · <span style="color:var(--green);font-weight:700;">'+(st.w||0)+'W</span> <span style="color:var(--red);font-weight:700;">'+(st.l||0)+'L</span></div>'
    +'</div>'
    +'<div style="display:flex;gap:16px;flex-wrap:wrap;">'
    +'<div style="text-align:center;"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:'+color+'">'+tP+'</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">PTS</div></div>'
    +'<div style="text-align:center;"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:var(--white)">'+tR+'</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">REB</div></div>'
    +'<div style="text-align:center;"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:var(--white)">'+tA+'</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">AST</div></div>'
    +'<div style="text-align:center;"><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:var(--white)">'+(tS+tB)+'</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">STL+BLK</div></div>'
    +'</div>'
    +'<button onclick="clearTeamBanner()" style="background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;">✕</button>'
    +'</div>';
  var existing=document.getElementById('team-banner');
  var playerPage=document.getElementById('tab-players');
  if(existing) existing.outerHTML=banner;
  else playerPage.insertAdjacentHTML('afterbegin',banner);
}

function clearTeamBanner(){
  var b=document.getElementById('team-banner');
  if(b){ b.remove(); document.getElementById('p-search').value=''; renderPlayers(); }
}

// ── TEAMS ──
function renderTeams(){
  var el=document.getElementById('tab-teams');
  if(!teams.length){el.innerHTML='<div class="no-game"><h2>No teams yet.</h2></div>';return;}
  var html='<h2 style="font-size:28px;font-weight:900;color:var(--white);margin-bottom:1.5rem;">Teams</h2><div class="teams-grid">';
  teams.forEach(function(t){
    var st=standings[t.name]||{w:0,l:0,pf:0,pa:0}; var gp=st.w+st.l;
    var ps=playerStats[t.name]||{};
    var rosterHtml=t.players.map(function(p){
      var s=ps[p.num]||{};
      return '<tr><td><span style="color:'+t.color+'">#'+p.num+'</span></td><td>'+p.name+'</td>'
        +'<td style="color:var(--muted)">'+p.pos+'</td><td class="pts-cell">'+(s.pts||0)+'</td>'
        +'<td>'+(s.reb||0)+'</td><td>'+(s.ast||0)+'</td><td>'+(s.gp||0)+'</td></tr>';
    }).join('');
    html+='<div class="team-card" style="cursor:pointer;" onclick="openTeamDetail(\''+t.name.replace(/'/g,"\\'")+'\');">'
      +'<div class="team-card-header"><div class="team-card-badge" style="background:'+t.color+'">'+teamInitials(t.name)+'</div>'
      +'<div style="flex:1;"><div class="team-card-name">'+t.name+'</div><div class="team-card-meta">'+t.players.length+' players · '+gp+' games</div></div>'
      +'<span style="font-size:11px;color:var(--muted);">Players →</span></div>'
      +'<div class="team-card-stats"><div class="tc-stat"><div class="tc-stat-val" style="color:'+t.color+'">'+(st.w||0)+'</div><div class="tc-stat-lbl">Wins</div></div>'
      +'<div class="tc-stat"><div class="tc-stat-val">'+(st.l||0)+'</div><div class="tc-stat-lbl">Losses</div></div>'
      +'<div class="tc-stat"><div class="tc-stat-val">'+(gp>0?((st.pf||0)/gp).toFixed(1):'—')+'</div><div class="tc-stat-lbl">PPG</div></div></div>'
      +(t.players.length?'<div style="overflow-x:auto;"><table><thead><tr><th>#</th><th>Player</th><th>POS</th><th>PTS</th><th>REB</th><th>AST</th><th>GP</th></tr></thead><tbody>'+rosterHtml+'</tbody></table></div>'
        :'<div style="padding:14px 20px;font-size:13px;color:var(--muted);">No players added.</div>')
      +'</div>';
  });
  html+='</div>';
  el.innerHTML=html;
}

// ── PLAYERS ──
function renderPlayers(){
  var q=(document.getElementById('p-search').value||'').toLowerCase();
  var rows=[];
  teams.forEach(function(t){
    var ps=playerStats[t.name]||{};
    t.players.forEach(function(p){
      if(!q||p.name.toLowerCase().indexOf(q)>=0||t.name.toLowerCase().indexOf(q)>=0){
        rows.push({p:p,teamName:t.name,teamColor:t.color,s:ps[p.num]||{}});
      }
    });
  });
  rows.sort(function(a,b){return (b.s.pts||0)-(a.s.pts||0);});
  document.getElementById('p-body').innerHTML=rows.length?rows.map(function(r){
    return '<tr><td><span style="color:'+r.teamColor+';font-weight:700;">#'+r.p.num+'</span></td>'
      +'<td>'+r.p.name+'</td>'
      +'<td style="text-align:left;"><span style="display:inline-flex;align-items:center;gap:6px;">'
      +'<span style="width:8px;height:8px;border-radius:50%;background:'+r.teamColor+';display:inline-block;"></span>'+r.teamName+'</span></td>'
      +'<td class="pts-cell">'+(r.s.pts||0)+'</td><td>'+(r.s.reb||0)+'</td><td>'+(r.s.ast||0)+'</td>'
      +'<td>'+(r.s.stl||0)+'</td><td>'+(r.s.blk||0)+'</td><td>'+(r.s.to||0)+'</td><td>'+(r.s.gp||0)+'</td></tr>';
  }).join(''):'<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:32px;font-style:italic;">No players found.</td></tr>';
}

// ── TAB NAV ──
function showTab(t){
  currentTab=t;
  document.querySelectorAll('.page').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.nav-tab').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+t).classList.add('active');
  var idx={live:0,schedule:1,standings:2,teams:3,players:4}[t];
  var tabs=document.querySelectorAll('.nav-tab');
  if(tabs[idx]) tabs[idx].classList.add('active');
  if(t==='live')      renderLive();
  if(t==='schedule')  renderSchedule();
  if(t==='standings') renderStandings();
  if(t==='teams')     { var b=document.getElementById('team-banner');if(b){b.remove();document.getElementById('p-search').value='';} renderTeams(); }
  if(t==='players')   renderPlayers();
}
</script>
</body>
</html>
