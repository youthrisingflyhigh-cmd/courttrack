<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southbay Hoops — Live Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0a0a0a;
  color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
}

/* ── TOP BAR ── */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 40px;
  background:#111;
  border-bottom:3px solid #FF4500;
}
.brand{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#FF4500;letter-spacing:4px;}
.brand span{color:#fff;}
.league-name{font-size:16px;color:#888;letter-spacing:2px;text-transform:uppercase;}
.live-dot{display:flex;align-items:center;gap:8px;font-size:14px;color:#22c55e;font-weight:700;letter-spacing:2px;}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ── MAIN SCOREBOARD ── */
.board-wrap{
  flex:1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1vh;
  padding:8px 40px;
}

.scoreboard{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
}

.team-side{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.team-color-bar{
  width:100%;
  height:8px;
  border-radius:4px;
  margin-bottom:8px;
}

.team-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(48px, 6.5vh, 110px);
  letter-spacing:4px;
  text-align:center;
  line-height:1;
}

.team-score{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(160px, 24vh, 340px);
  line-height:0.9;
  text-align:center;
}

.team-fouls{
  font-size:clamp(24px, 3.6vw, 42px);
  color:#888;
  letter-spacing:2px;
}
.team-fouls span{color:#FF4500;font-weight:700;}

.bonus-light{
  margin-top:14px;
  padding:10px 28px;
  border-radius:28px;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(20px, 2.6vw, 30px);
  letter-spacing:5px;
  color:#4a3a26;
  background:#1c1712;
  border:1px solid #2a221a;
  opacity:0.5;
  transition:opacity 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
}
.bonus-light.active{
  opacity:1;
  color:#1a0f00;
  background:#f59e0b;
  box-shadow:0 0 22px 4px rgba(245,158,11,0.55), 0 0 44px 12px rgba(245,158,11,0.22);
  animation:bonusGlow 1.4s ease-in-out infinite;
}
@keyframes bonusGlow{
  0%,100%{box-shadow:0 0 22px 4px rgba(245,158,11,0.55), 0 0 44px 12px rgba(245,158,11,0.22);}
  50%{box-shadow:0 0 30px 8px rgba(245,158,11,0.85), 0 0 58px 18px rgba(245,158,11,0.38);}
}

/* ── CENTER ── */
.center-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  min-width:200px;
  padding:0 30px;
}

.clock{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(140px, 24vh, 320px);
  color:#ffffff;
  letter-spacing:4px;
  line-height:1;
  text-align:center;
}
.clock.warning{color:#eab308;}
.clock.urgent{color:#ef4444;animation:blink 0.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}

.shotclock-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.shotclock-label{
  font-size:clamp(12px, 1.4vw, 16px);
  color:#666;
  letter-spacing:4px;
}
.shotclock-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(140px, 24vh, 320px);
  color:#ef4444;
  line-height:1;
  padding:2px 26px;
  border:4px solid #221a10;
  border-radius:12px;
  background:#141414;
  min-width:1.6em;
  display:flex;
  align-items:center;
  justify-content:center;
}
.shotclock-num.warning{color:#eab308;border-color:#eab308;}
.shotclock-num.urgent{color:#ef4444;border-color:#ef4444;animation:blink 0.5s infinite;}

.half-badge{
  background:#FF4500;
  color:#000;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(32px, 4vw, 52px);
  letter-spacing:3px;
  padding:8px 26px;
  border-radius:8px;
}

.vs{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;
  color:#333;
  letter-spacing:4px;
}

/* ── BOTTOM BAR ── */
.bottom-bar{
  background:#111;
  border-top:2px solid #1a1a1a;
  padding:6px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.bottom-ticker{
  font-size:14px;
  color:#555;
  letter-spacing:1px;
}
.bottom-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  color:#333;
  letter-spacing:3px;
}

/* No game state */
.no-game-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}
.no-game-screen .big{
  font-family:'Bebas Neue',sans-serif;
  font-size:80px;
  color:#FF4500;
  letter-spacing:6px;
}
.no-game-screen .sub{
  font-size:20px;
  color:#555;
  letter-spacing:2px;
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
  <div class="brand">COURT<span>TRACK</span></div>
  <div class="league-name" id="league-label">Southbay Hoops</div>
  <div class="live-dot" id="live-indicator" style="display:none;"><div class="dot"></div>LIVE</div>
</div>

<!-- Main content -->
<div id="no-game" class="no-game-screen">
  <div class="big">SOUTHBAY HOOPS</div>
  <div class="sub">WAITING FOR GAME TO START...</div>
  <div style="font-size:14px;color:#333;letter-spacing:1px;margin-top:20px;">southbayhoops.org</div>
</div>

<div id="game-display" class="board-wrap" style="display:none;">
  <div class="clock" id="sb-clock">20:00</div>

  <div class="scoreboard">
    <!-- Home team -->
    <div class="team-side">
      <div class="team-color-bar" id="home-bar"></div>
      <div class="team-name" id="sb-home-name">HOME</div>
      <div class="team-score" id="sb-home-score" style="color:#FF4500;">0</div>
      <div class="team-fouls">FOULS: <span id="sb-home-fouls">0</span></div>
      <div class="bonus-light" id="sb-home-bonus">BONUS</div>
    </div>

    <!-- Center -->
    <div class="center-block">
      <div class="shotclock-unit">
        <div class="shotclock-label">SHOT CLOCK</div>
        <div class="shotclock-num" id="sb-shotclock">30</div>
      </div>
      <div class="half-badge" id="sb-half">H1</div>
    </div>

    <!-- Away team -->
    <div class="team-side">
      <div class="team-color-bar" id="away-bar"></div>
      <div class="team-name" id="sb-away-name">AWAY</div>
      <div class="team-score" id="sb-away-score" style="color:#ffffff;">0</div>
      <div class="team-fouls">FOULS: <span id="sb-away-fouls">0</span></div>
      <div class="bonus-light" id="sb-away-bonus">BONUS</div>
    </div>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <div class="bottom-ticker" id="bottom-ticker">San Jose High School · Wednesday Nights · 6:30 PM</div>
  <div class="bottom-logo">POWERED BY YRFH · 501(c)(3) NONPROFIT</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAmITPV5C-xbVAqTAJcVsRB7ROO7s_cwzQ",
  authDomain:"court-track-39271.firebaseapp.com",
  databaseURL:"https://court-track-39271-default-rtdb.firebaseio.com",
  projectId:"court-track-39271",
  storageBucket:"court-track-39271.firebasestorage.app",
  messagingSenderId:"559684754695",
  appId:"1:559684754695:web:0d8b12f3519329d8fc79a2"
});
var db = firebase.database();

var teams = [];

function fmtClock(seconds){
  var m = Math.floor(seconds/60);
  var s = seconds % 60;
  return m + ':' + (s<10?'0':'') + s;
}

function hexToRgb(hex){
  var r=parseInt(hex.slice(1,3),16);
  var g=parseInt(hex.slice(3,5),16);
  var b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

// Load teams
db.ref('ct/teams').on('value', function(s){
  var v = s.val();
  if(!v) return;
  teams = Array.isArray(v) ? v.filter(Boolean) : Object.values(v).filter(Boolean);
});

// Watch game
db.ref('ct/game').on('value', function(s){
  var game = s.val();
  if(!game || !game.active && game.homeScore == null){
    document.getElementById('no-game').style.display = 'flex';
    document.getElementById('game-display').style.display = 'none';
    document.getElementById('live-indicator').style.display = 'none';
    return;
  }

  var isFinal = game.status === 'final';

  document.getElementById('no-game').style.display = 'none';
  document.getElementById('game-display').style.display = 'flex';
  // Show FINAL badge instead of LIVE indicator when game is over
  document.getElementById('live-indicator').style.display = 'flex';
  document.getElementById('live-indicator').innerHTML = isFinal
    ? '<span style="background:rgba(34,197,94,0.15);color:#22c55e;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:2px;">✓ FINAL</span>'
    : '<span style="background:rgba(255,69,0,0.15);color:#FF4500;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:2px;animation:pulse 1.5s infinite;">● LIVE</span>';

  var ht = teams[game.hi] || {};
  var at = teams[game.ai] || {};

  document.getElementById('sb-home-name').textContent = (ht.name || 'HOME').toUpperCase();
  document.getElementById('sb-away-name').textContent = (at.name || 'AWAY').toUpperCase();
  document.getElementById('sb-home-score').textContent = game.homeScore || 0;
  document.getElementById('sb-away-score').textContent = game.awayScore || 0;
  document.getElementById('sb-home-score').style.color = ht.color || '#FF4500';
  document.getElementById('sb-away-score').style.color = at.color || '#ffffff';
  document.getElementById('home-bar').style.background = ht.color || '#FF4500';
  document.getElementById('away-bar').style.background = at.color || '#888';
  document.getElementById('sb-half').textContent = 'H' + (game.q || 1);

  // Team fouls
  var hFouls = 0, aFouls = 0;
  if(game.hStats) Object.values(game.hStats).forEach(function(p){ hFouls += (p.foul||0); });
  if(game.aStats) Object.values(game.aStats).forEach(function(p){ aFouls += (p.foul||0); });
  document.getElementById('sb-home-fouls').textContent = hFouls;
  document.getElementById('sb-away-fouls').textContent = aFouls;

  // Bonus lights — trigger at 7 team fouls
  var BONUS_THRESHOLD = 7;
  document.getElementById('sb-home-bonus').classList.toggle('active', hFouls >= BONUS_THRESHOLD);
  document.getElementById('sb-away-bonus').classList.toggle('active', aFouls >= BONUS_THRESHOLD);

  // Clock
  if(game.clock){
    var secs = game.clock.seconds || 0;
    var clockEl = document.getElementById('sb-clock');
    clockEl.textContent = fmtClock(secs);
    clockEl.className = 'clock' + (secs <= 30 ? ' urgent' : secs <= 60 ? ' warning' : '');
  }

  // Shot clock
  if(game.shotClock){
    var scSecs = game.shotClock.seconds != null ? game.shotClock.seconds : 30;
    var scEl = document.getElementById('sb-shotclock');
    scEl.textContent = scSecs;
    scEl.className = 'shotclock-num' + (scSecs <= 5 ? ' urgent' : scSecs <= 10 ? ' warning' : '');
  }

  // Bottom ticker
  document.getElementById('bottom-ticker').textContent =
    (ht.name||'Home') + ' ' + (game.homeScore||0) + '  —  ' + (game.awayScore||0) + '  ' + (at.name||'Away') +
    '  ·  ' + (game.date||'') + '  ·  San Jose High School';
});

// Settings
db.ref('ct/settings').once('value').then(function(s){
  var v = s.val();
  if(v && v.leagueName) document.getElementById('league-label').textContent = v.leagueName;
});
</script>
</body>
</html>
